# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude: # 자동 생성 파일이나 빌드 결과물은 검사 제외
    - "build/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # 파란색 줄(경고)이 너무 신경 쓰인다면 특정 항목의 심각도를 조절할 수 있음
    todo: ignore

linter:
  rules:
    # 1. 비동기 안전성 (매우 중요!)
    - use_build_context_synchronously # 비동기(await) 후 context 사용 시 mounted 체크 강제

    # 2. 코드 명확성 및 오타 방지
    - always_declare_return_types # 함수의 반환 타입(void, Future 등)을 명시하여 VoidCallback 에러 예방
    - prefer_final_fields # 값이 바뀌지 않는 필드는 final로 선언하도록 유도
    - avoid_print # 배포 전 디버그용 print문 제거

    # 3. 플러터 성능 최적화
    - prefer_const_constructors # 위젯 재빌드 성능 향상을 위해 const 사용 권장
    - prefer_const_literals_to_create_immutables # 리스트 등에서 const 권장

    # 4. 가독성 및 스타일 통일
    - sort_child_properties_last # 위젯의 child 속성을 항상 마지막에 배치하여 가독성 확보
    - sized_box_for_whitespace # 여백을 줄 때 Container 대신 가벼운 SizedBox 사용 유도
