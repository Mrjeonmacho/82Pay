server {
    listen 80;
    server_name localhost;

    # [1] OCR 대용량 이미지 업로드 대응
    client_max_body_size 50m;
    client_body_buffer_size 16m;

    # [2] 웹 브라우저 CORS 및 보안 헤더 설정
    # Ingress를 거쳐 들어오므로 프론트엔드 Nginx에서 명시적으로 허용해줍니다.
    add_header 'Access-Control-Allow-Origin' 'https://palipay8282.duckdns.org' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'X-Requested-With,Content-Type,Authorization' always;

    # 1. 프론트엔드 정적 파일 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. AI 서버 (FastAPI) - OCR 전용
    location /api/ai/ {
        # 💡 중요: FastAPI가 /api/ai/ 경로를 포함하지 않는다면 끝에 / 를 붙이세요.
        # 만약 FastAPI 엔드포인트가 @app.post("/api/ai/ocr") 라면 / 를 빼야 합니다.
        proxy_pass http://palipay-ai-service.default.svc.cluster.local:80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # HTTPS 프로토콜 유지
    }

    # 3. 일반 백엔드 API (Spring Boot)
    location /api/ {
        proxy_pass http://palipay-backend-svc.default.svc.cluster.local:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Spring Boot 세션이나 Redirect 문제를 방지하기 위해 추가
        proxy_set_header X-Forwarded-Port 443;
    }
}