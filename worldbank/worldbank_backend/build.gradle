plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.worldbank'
version = '0.0.1-SNAPSHOT'
description = 'Backend API server for WorldBank platform.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // ✅ Atomikos 6.0.0 (Spring Boot 3 / Jakarta 전용)
    implementation 'com.atomikos:transactions-jta:6.0.0:jakarta'
    implementation 'com.atomikos:transactions-jdbc:6.0.0:jakarta'

    // ✅ Jakarta Transaction API 명시
    implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    
    // ✅ Atomikos 6.0.0 내부에서 여전히 참조할 수 있는 레거시 javax 패키지 대응
    compileOnly 'javax.transaction:javax.transaction-api:1.3'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
	enabled = false
}